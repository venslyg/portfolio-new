<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28" fill="none">
  <!-- Precision pointer tip hotspot at (2, 2) -->
  <defs>
    <linearGradient id="cursor-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C4B5FD" />
      <stop offset="50%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#67E8F9" />
    </linearGradient>
    <filter id="cursor-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="1" dy="1.5" stdDeviation="1.2" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <g filter="url(#cursor-shadow)">
    <!-- Crisp dark outer border for high contrast against light or dark backgrounds -->
    <!-- Pointer stem & flag -->
    <path d="M4 2 L4 18 M4 2 L14 7 L14 11 L4 7" stroke="#0B0C10" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <ellipse cx="6" cy="18" rx="4" ry="3" transform="rotate(-25 6 18)" fill="#0B0C10" />

    <!-- Vibrant Inner Musical Note -->
    <!-- Precision target tip at top left -->
    <path d="M4 2 L4 18" stroke="url(#cursor-grad)" stroke-width="1.8" stroke-linecap="round" />
    <!-- Beamed flag -->
    <path d="M4 3 L13 7.5 L13 9.5 L4 5.5 Z" fill="url(#cursor-grad)" />
    <!-- Note head with subtle angle -->
    <ellipse cx="6" cy="18" rx="3.2" ry="2.2" transform="rotate(-25 6 18)" fill="url(#cursor-grad)" />
    <!-- Precision Hotspot Dot -->
    <circle cx="4" cy="2" r="1" fill="#FFFFFF" />
  </g>
</svg>
